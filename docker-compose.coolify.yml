# ==============================================================================
# Coolify Production Docker Compose Specification for kcal-log
# Multi-container orchestration: FrankenPHP Web, Horizon, Reverb, Scheduler, MariaDB & Redis
# ==============================================================================

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kcal-log-web:latest
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-kcal-log}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL}"
      ROLE: web
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-kcal_log}"
      DB_USERNAME: "${DB_USERNAME:-kcal_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-kcal-log-id}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-kcal-log-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: reverb
      REVERB_PORT: 9080
      REVERB_SCHEME: http
      VITE_REVERB_APP_KEY: "${REVERB_APP_KEY:-kcal-log-key}"
      VITE_REVERB_HOST: "${VITE_REVERB_HOST:-}"
      VITE_REVERB_PORT: "${VITE_REVERB_PORT:-443}"
      VITE_REVERB_SCHEME: "${VITE_REVERB_SCHEME:-https}"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - app_storage:/app/apps/web/storage
    networks:
      - kcal_internal

  horizon:
    image: kcal-log-web:latest
    command: ["php", "artisan", "horizon"]
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-kcal-log}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      ROLE: horizon
      RUN_MIGRATIONS: "false"
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-kcal_log}"
      DB_USERNAME: "${DB_USERNAME:-kcal_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-kcal-log-id}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-kcal-log-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: reverb
      REVERB_PORT: 9080
      REVERB_SCHEME: http
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/apps/web/storage
    networks:
      - kcal_internal

  reverb:
    image: kcal-log-web:latest
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=9080"]
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-kcal-log}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      ROLE: reverb
      RUN_MIGRATIONS: "false"
      REVERB_APP_ID: "${REVERB_APP_ID:-kcal-log-id}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-kcal-log-key}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: 9080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - kcal_internal

  scheduler:
    image: kcal-log-web:latest
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    environment:
      APP_NAME: "${APP_NAME:-kcal-log}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      ROLE: scheduler
      RUN_MIGRATIONS: "false"
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-kcal_log}"
      DB_USERNAME: "${DB_USERNAME:-kcal_user}"
      DB_PASSWORD: "${DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      QUEUE_CONNECTION: redis
    depends_on:
      web:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/app/apps/web/storage
    networks:
      - kcal_internal

  database:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-kcal_log}"
      MYSQL_USER: "${DB_USERNAME:-kcal_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - kcal_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - kcal_internal

volumes:
  mariadb_data:
  redis_data:
  app_storage:

networks:
  kcal_internal:
    driver: bridge
