services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kcal-log-web:latest
    ports:
      - "${HTTP_PORT:-8000}:80"
    environment:
      APP_NAME: kcal-log
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kcal_log}
      DB_USERNAME: ${DB_USERNAME:-kcal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-kcal-log-id}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-kcal-log-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_HOST: reverb
      REVERB_PORT: 9080
      REVERB_SCHEME: http
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kcal_network

  database:
    image: mariadb:10.11
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kcal_log}
      MYSQL_USER: ${DB_USERNAME:-kcal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - kcal_network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - kcal_network

  horizon:
    image: kcal-log-web:latest
    command: ["php", "artisan", "horizon"]
    environment:
      APP_NAME: kcal-log
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kcal_log}
      DB_USERNAME: ${DB_USERNAME:-kcal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kcal_network

  reverb:
    image: kcal-log-web:latest
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=9080"]
    ports:
      - "${REVERB_PORT:-9080}:9080"
    environment:
      APP_NAME: kcal-log
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      REVERB_APP_ID: ${REVERB_APP_ID:-kcal-log-id}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-kcal-log-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_SERVER_PORT: 9080
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kcal_network

  scheduler:
    image: kcal-log-web:latest
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_NAME: kcal-log
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mariadb
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kcal_log}
      DB_USERNAME: ${DB_USERNAME:-kcal_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONNECTION: redis
    depends_on:
      web:
        condition: service_started
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kcal_network

volumes:
  mariadb_data:
  redis_data:

networks:
  kcal_network:
    driver: bridge
