name: Build Android APK & Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'
      create_release:
        description: 'Publish as official GitHub Release (ADR-0006)?'
        type: boolean
        required: true
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android Native Project (Expo Prebuild)
        run: pnpm --filter @kcal-log/mobile exec expo prebuild --platform android --no-install

      - name: Build Release APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package Artifacts & Calculate SHA-256 Checksum
        run: |
          mkdir -p dist-apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist-apk/kcal-log.apk
          cd dist-apk
          sha256sum kcal-log.apk > kcal-log.apk.sha256
          APK_HASH=$(awk '{print $1}' kcal-log.apk.sha256)
          echo "APK_SHA256=$APK_HASH" >> $GITHUB_ENV
          echo "Calculated APK SHA-256 Checksum: $APK_HASH"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcal-log-apk
          path: dist-apk/
          retention-days: 30

      - name: Publish GitHub Release (ADR-0006 Self-Update)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true' || github.event.inputs.create_release == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          fi

          if [ -z "$TAG" ]; then
            TAG="v0.1.0"
          fi

          echo "Publishing GitHub Release for tag: $TAG"

          gh release create "$TAG" \
            dist-apk/kcal-log.apk \
            dist-apk/kcal-log.apk.sha256 \
            --title "kcal-log Mobile Release $TAG" \
            --notes "### kcal-log Mobile $TAG

          Open-source, privacy-first nutrition & fitness tracking Android application.

          #### Downloads & Verification (ADR-0006)
          - **Android APK**: \`kcal-log.apk\`
          - **Cryptographic SHA-256 Checksum**:
          \`\`\`
          ${{ env.APK_SHA256 }}
          \`\`\`

          *Verified for Android 8.0+ (API 26+) devices with in-app cryptographic validation.*" \
            --verify-tag=false
