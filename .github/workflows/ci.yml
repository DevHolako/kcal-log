name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret & Safety Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Leak Guard
        run: bash scripts/check-secrets.sh

  packages-and-lint:
    name: Monorepo Domain Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Nutrition Domain Engine
        run: pnpm test

      - name: Lint and Code Formatting Check
        run: pnpm lint

  phpstan:
    name: PHPStan Level 5 Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, pcntl, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/web/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/web/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: apps/web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan Analysis
        working-directory: apps/web
        run: ./vendor/bin/phpstan analyse --error-format=github

  backend-tests:
    name: Pest Feature & Unit Suite
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kcal_log_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, pcntl, redis, gd, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/web/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/web/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: apps/web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        working-directory: apps/web
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run Database Migrations
        working-directory: apps/web
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kcal_log_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate --env=testing --force

      - name: Ensure Vite Manifest for Testing
        working-directory: apps/web
        run: |
          mkdir -p public/build
          echo '{"resources/js/app.tsx":{"file":"assets/app.js","isEntry":true,"src":"resources/js/app.tsx"}}' > public/build/manifest.json

      - name: Run Pest Tests
        working-directory: apps/web
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --parallel

  e2e-playwright:
    name: Playwright End-to-End Suite
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kcal_log
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
          run_install: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, pcntl, redis, gd, zip
          coverage: none

      - name: Install Composer Dependencies
        working-directory: apps/web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment & Migrate Database
        working-directory: apps/web
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kcal_log
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Production Assets
        run: pnpm --filter @kcal-log/web build

      - name: Install Playwright Chromium Browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: apps/web
        env:
          CI: 'true'
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kcal_log
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: pnpm test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  docker-build:
    name: Production Docker Build & Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kcal-log-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
