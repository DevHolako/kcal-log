name: CI / CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build_apk:
        description: 'Force Assemble Android APK & Release'
        type: boolean
        required: false
        default: false
      force_deploy_web:
        description: 'Force Coolify Web Deployment'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Release Tag name (override, e.g. v0.1.6)'
        type: string
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: write
  actions: write

jobs:
  secret-scan:
    name: Secret & Safety Scanner
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Secret Leak Guard
        run: bash scripts/check-secrets.sh

      - name: Cancel workflow if failed
        if: failure()
        run: gh run cancel ${{ github.run_id }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-changes:
    name: Change Detection & Pipeline Matrix
    runs-on: ubuntu-24.04
    outputs:
      web_changed: ${{ steps.detect.outputs.web_changed }}
      mobile_version_bumped: ${{ steps.detect.outputs.mobile_version_bumped }}
      is_tag: ${{ steps.detect.outputs.is_tag }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      should_build_apk: ${{ steps.detect.outputs.should_build_apk }}
      should_deploy_web: ${{ steps.detect.outputs.should_deploy_web }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect Changes & Compute Triggers
        id: detect
        env:
          INPUT_FORCE_BUILD_APK: ${{ inputs.force_build_apk }}
          INPUT_FORCE_DEPLOY_WEB: ${{ inputs.force_deploy_web }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node .github/scripts/detect-ci-changes.mjs

  packages-and-lint:
    name: Monorepo Domain Tests & Quality
    needs: [secret-scan]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.5.2
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test Nutrition Domain Engine
        run: pnpm test

      - name: Test Mobile Client Engine
        run: pnpm test:mobile

      - name: Lint and Code Formatting Check
        run: pnpm lint

      - name: Cancel workflow if failed
        if: failure()
        run: gh run cancel ${{ github.run_id }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  phpstan:
    name: PHPStan Level 5 Static Analysis
    needs: [secret-scan, detect-changes]
    if: needs.detect-changes.outputs.web_changed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, pcntl, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: apps/web/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/web/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: apps/web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan Analysis
        working-directory: apps/web
        run: ./vendor/bin/phpstan analyse --error-format=github

      - name: Cancel workflow if failed
        if: failure()
        run: gh run cancel ${{ github.run_id }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Pest Feature & Unit Suite
    needs: [secret-scan, detect-changes]
    if: needs.detect-changes.outputs.web_changed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kcal_log_test
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, pcntl, redis, gd, zip
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: apps/web/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('apps/web/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        working-directory: apps/web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        working-directory: apps/web
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Run Database Migrations
        working-directory: apps/web
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kcal_log_test
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: php artisan migrate --env=testing --force

      - name: Ensure Vite Manifest for Testing
        working-directory: apps/web
        run: |
          mkdir -p public/build
          echo '{"resources/js/app.tsx":{"file":"assets/app.js","isEntry":true,"src":"resources/js/app.tsx"}}' > public/build/manifest.json

      - name: Run Pest Tests
        working-directory: apps/web
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test --parallel

      - name: Cancel workflow if failed
        if: failure()
        run: gh run cancel ${{ github.run_id }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-playwright:
    name: Playwright End-to-End Suite
    needs: [secret-scan, detect-changes]
    if: needs.detect-changes.outputs.web_changed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: kcal_log
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.5.2
          run_install: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, bcmath, pcntl, redis, gd, zip
          coverage: none

      - name: Install Composer Dependencies
        working-directory: apps/web
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment & Migrate Database
        working-directory: apps/web
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kcal_log
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Production Assets
        run: pnpm --filter @kcal-log/web build

      - name: Install Playwright Chromium Browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: apps/web
        env:
          CI: 'true'
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: kcal_log
          DB_USERNAME: root
          DB_PASSWORD: ''
        run: pnpm test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

      - name: Cancel workflow if failed
        if: failure()
        run: gh run cancel ${{ github.run_id }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Production Docker Build & Verify
    needs: [secret-scan, detect-changes]
    if: needs.detect-changes.outputs.web_changed == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Production Container Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: kcal-log-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cancel workflow if failed
        if: failure()
        run: gh run cancel ${{ github.run_id }} || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-coolify:
    name: Deploy to Production (Coolify Webhook)
    needs: [detect-changes, secret-scan, packages-and-lint, phpstan, backend-tests, e2e-playwright, docker-build]
    if: needs.detect-changes.outputs.should_deploy_web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Coolify Webhook
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK_URL}" ] || [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::COOLIFY_WEBHOOK_URL or COOLIFY_TOKEN secret is missing or empty."
            exit 1
          fi

          echo "All CI quality checks and container builds succeeded!"
          echo "Triggering Coolify deployment webhook..."

          RESPONSE=$(curl -sSL --fail-with-body -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_WEBHOOK_URL}")

          echo "Coolify deployment successfully triggered: ${RESPONSE}"

  build-and-release-apk:
    name: Assemble Android APK & Release
    needs: [detect-changes, secret-scan, packages-and-lint]
    if: needs.detect-changes.outputs.should_build_apk == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android Native Project (Expo Prebuild)
        run: pnpm --filter @kcal-log/mobile exec expo prebuild --platform android --no-install

      - name: Build Release APK with Gradle
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Package Artifacts & Calculate SHA-256 Checksum
        run: |
          mkdir -p dist-apk
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist-apk/kcal-log.apk
          cd dist-apk
          sha256sum kcal-log.apk > kcal-log.apk.sha256
          APK_HASH=$(awk '{print $1}' kcal-log.apk.sha256)
          echo "APK_SHA256=$APK_HASH" >> $GITHUB_ENV
          echo "Calculated APK SHA-256 Checksum: $APK_HASH"

      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kcal-log-apk
          path: dist-apk/
          retention-days: 30

      - name: Publish GitHub Release (ADR-0006 Self-Update)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.detect-changes.outputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./apps/mobile/app.json').expo.version")"
          fi

          echo "Publishing GitHub Release for tag: $TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading APK assets with --clobber..."
            gh release upload "$TAG" dist-apk/kcal-log.apk dist-apk/kcal-log.apk.sha256 --clobber
          else
            echo "Creating new GitHub Release $TAG..."
            gh release create "$TAG" \
              dist-apk/kcal-log.apk \
              dist-apk/kcal-log.apk.sha256 \
              --target "${{ github.sha }}" \
              --title "kcal-log Mobile Release $TAG" \
              --notes "### kcal-log Mobile $TAG

          Open-source, privacy-first nutrition & fitness tracking Android application.

          #### Downloads & Verification (ADR-0006)
          - **Android APK**: \`kcal-log.apk\`
          - **Cryptographic SHA-256 Checksum**:
          \`\`\`
          ${{ env.APK_SHA256 }}
          \`\`\`

          *Verified for Android 8.0+ (API 26+) devices with in-app cryptographic validation.*" \
              --verify-tag=false
          fi
